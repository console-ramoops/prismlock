name: Build and validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate catalog
        run: python3 scripts/check_catalog.py
      - name: Check fingerprint loading regressions
        run: python3 scripts/check_icon_loader.py
      - name: Restore persistent release keystore
        env:
          KEYSTORE_B64: ${{ secrets.PRISMLOCK_KEYSTORE_B64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/prismlock.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          echo "PRISMLOCK_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Assemble signed release APK
        env:
          PRISMLOCK_STORE_PASSWORD: ${{ secrets.PRISMLOCK_STORE_PASSWORD }}
          PRISMLOCK_KEY_PASSWORD: ${{ secrets.PRISMLOCK_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: PrismLock-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Test update, catalog and modern hook flows
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug
